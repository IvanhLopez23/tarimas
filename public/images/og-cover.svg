  <g transform="translate(760 200)">
    <rect x="0" y="0" width="300" height="20" rx="4" fill="#94A3B8" />
    <rect x="0" y="60" width="300" height="20" rx="4" fill="#94A3B8" />
    <rect x="0" y="120" width="300" height="20" rx="4" fill="#94A3B8" />
    <rect x="0" y="20" width="40" height="40" rx="3" fill="#64748B" />
    <rect x="130" y="20" width="40" height="40" rx="3" fill="#64748B" />
    <rect x="260" y="20" width="40" height="40" rx="3" fill="#64748B" />
    <rect x="0" y="80" width="40" height="40" rx="3" fill="#64748B" />
    <rect x="130" y="80" width="40" height="40" rx="3" fill="#64748B" />
    <rect x="260" y="80" width="40" height="40" rx="3" fill="#64748B" />
