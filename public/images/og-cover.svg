<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 630"
  width="1200"
  height="630"
  role="img"
  aria-label="Tarimas y Logística Pro, tarimas de exportación con envío nacional e internacional"
>
  <rect width="1200" height="630" fill="#0F172A" />

  <g fill="#EA580C">
    <rect x="84" y="72" width="52" height="10" rx="5" />
    <rect x="84" y="100" width="52" height="10" rx="5" />
    <rect x="90" y="82" width="10" height="18" rx="5" />
    <rect x="120" y="82" width="10" height="18" rx="5" />
  </g>
  <text
