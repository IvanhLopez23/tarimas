<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 900"
  width="1200"
  height="900"
  role="img"
  aria-label="Tarimas de madera apiladas y flejadas en el patio de la bodega"
>
  <defs>
    <g id="pallet">
      <rect x="0" y="0" width="88" height="14" rx="3" fill="#94A3B8" />
      <rect x="106" y="0" width="88" height="14" rx="3" fill="#94A3B8" />
      <rect x="212" y="0" width="88" height="14" rx="3" fill="#94A3B8" />
      <rect x="0" y="14" width="34" height="28" rx="2" fill="#64748B" />
      <rect x="133" y="14" width="34" height="28" rx="2" fill="#64748B" />
      <rect x="266" y="14" width="34" height="28" rx="2" fill="#64748B" />
      <rect x="0" y="42" width="88" height="14" rx="3" fill="#94A3B8" />
      <rect x="106" y="42" width="88" height="14" rx="3" fill="#94A3B8" />
      <rect x="212" y="42" width="88" height="14" rx="3" fill="#94A3B8" />
    </g>
  </defs>

  <rect width="1200" height="900" fill="#F8FAFC" />

  <!-- Patio floor -->
  <rect x="0" y="700" width="1200" height="8" rx="4" fill="#E2E8F0" />
  <rect x="0" y="760" width="1200" height="4" rx="2" fill="#EEF2F7" />
  <rect x="0" y="826" width="1200" height="4" rx="2" fill="#EEF2F7" />

  <!-- Left stack -->
  <g transform="translate(120 500)">
    <use href="#pallet" y="0" />
    <use href="#pallet" y="62" />
    <use href="#pallet" y="124" />
    <rect x="146" y="-16" width="8" height="212" rx="4" fill="#EA580C" opacity="0.9" />
  </g>

  <!-- Middle stack, taller -->
  <g transform="translate(500 376)">
    <use href="#pallet" y="0" />
    <use href="#pallet" y="62" />
    <use href="#pallet" y="124" />
    <use href="#pallet" y="186" />
    <rect x="146" y="-16" width="8" height="274" rx="4" fill="#EA580C" opacity="0.9" />
  </g>

  <!-- Right stack -->
  <g transform="translate(880 500)">
    <use href="#pallet" y="0" />
    <use href="#pallet" y="62" />
    <use href="#pallet" y="124" />
    <rect x="146" y="-16" width="8" height="212" rx="4" fill="#EA580C" opacity="0.9" />
  </g>

  <!-- Load tag -->
  <g transform="translate(640 300)">
    <rect width="180" height="52" rx="10" fill="#0F172A" />
    <rect x="16" y="20" width="86" height="10" rx="5" fill="#EA580C" />
    <rect x="112" y="20" width="52" height="10" rx="5" fill="#64748B" />
  </g>
</svg>
